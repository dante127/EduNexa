name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore SchoolOS.sln
      - name: Build
        run: dotnet build SchoolOS.sln --no-restore -c Release
      - name: Test
        run: dotnet test SchoolOS.sln --no-build -c Release

